[project]
name = "geo-data-security-server2"
version = "0.1.0"
description = "Local processing pipeline for the geospatial data security platform"
requires-python = ">=3.11,<3.13"
dependencies = [
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "httpx2>=2.12.0",
  "numpy>=2,<3",
  "Pillow>=10,<12",
  "psutil>=6,<8",
  "pyproj>=3.7,<4",
  "pyshp>=2.3,<3",
  "pytest>=8,<9",
  "python-multipart>=0.0.9,<1",
  "pywavelets>=1.9.0",
  "rasterio>=1.4,<2",
  "scipy>=1.17.1",
  "shapely>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
