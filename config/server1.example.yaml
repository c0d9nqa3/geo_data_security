# 服务器1角色配置示例
# 统一平台通过角色配置启用接入/控制能力，不代表服务器1是一套独立业务系统。
environment: test
roles:
  - access_control
  - terminal_ui
server:
  host: 0.0.0.0
  port: 8081
  public_base_url: http://SERVER1_HOST:8081
server2:
  processing_base_url: http://SERVER2_HOST:9081
  connect_timeout_seconds: 30
  request_timeout_seconds: 300
storage:
  temporary_receive_dir: C:/geo_data_security/runtime/server1/receive
security:
  jwt_secret: REPLACE_IN_LOCAL_SECRET_STORE
  tls_enabled: false
limits:
  max_terminals: 11
  max_upload_size_gb: 50
